# =============================================================
# 自定义图标（覆盖/补充 Stellar 主题图标库）
# -------------------------------------------------------------
# 主题会把本文件与自带 _data/icons.yml 合并，键相同的覆盖主题。
# 键格式：namespace:name，菜单里写 icon: 'gmaxh:home' 即可引用。
#
# 设计规范（与开往官方方形小火车 logo 同一套语言）：
#   24×24 网格、2px 圆角描边、无填充、端点为圆角、
#   圆角半径 2–3px、留白 3px，正负形清晰。
#   stroke 用 currentColor：跟随主题文字色（浅色深灰、深色浅灰），
#   悬停时主题会自动切换为该菜单项的 theme 色。
# =============================================================

